<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medical Pharma Quiz – 20 Questions</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #111827;
    }
    .card {
      max-width: 1000px;
      margin: 0 auto;
      background: #f9fafb;
      border-radius: 20px;
      box-shadow: 0 25px 35px rgba(0,0,0,0.15);
      padding: 2.5rem 3rem;
    }
    h1,h2 { color:#111827; }
    label { font-weight:600; display:block; margin-top:0.9rem; margin-bottom:0.25rem; }
    input {
      width:100%;
      padding:0.8rem;
      border-radius:10px;
      border:2px solid #cbd5e1;
      font-size:1rem;
    }
    input:focus {
      outline:none;
      border-color:#4facfe;
      box-shadow:0 0 0 3px rgba(79,172,254,0.25);
    }
    button {
      padding:0.9rem 1.8rem;
      border-radius:12px;
      border:none;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
      color:white;
      font-weight:700;
      cursor:pointer;
      transition:all .25s ease;
      font-size:1rem;
    }
    button:hover:not(:disabled) {
      box-shadow:0 10px 25px rgba(79,172,254,.6);
      transform:translateY(-2px);
    }
    button:disabled { opacity:.6; cursor:not-allowed; }
    #startError { margin-top:0.75rem; color:#dc2626; font-weight:600; }

    .header { text-align:center; margin-bottom:1.5rem; }
    .header h1 { font-size:2.3rem; margin-bottom:0.3rem; }
    #metaInfo { color:#4b5563; font-size:.95rem; }
    #timer { margin-top:0.25rem; font-weight:600; }

    .progress-bar {
      background:#e5e7eb;
      height:10px;
      border-radius:5px;
      overflow:hidden;
      margin-top:1.3rem;
    }
    .progress-fill {
      background:linear-gradient(90deg,#4facfe,#00f2fe);
      height:100%; width:0%; transition:width .6s ease;
    }

    .question-block { margin-top:2rem; }
    .q-header { display:flex; gap:1rem; align-items:flex-start; font-size:1.05rem; font-weight:600; }
    .q-number {
      width:40px; height:40px; border-radius:50%;
      background:#4facfe; color:white; display:flex;
      align-items:center; justify-content:center;
      flex-shrink:0; font-weight:700;
    }
    .q-text { flex:1; }

    .options { margin-top:1rem; display:grid; gap:12px; }
    .option {
      padding:0.9rem 1rem;
      background:#ffffff;
      border-radius:10px;
      border:2px solid #cbd5e1;
      cursor:pointer;
      transition:all .25s ease;
      font-size:.95rem;
    }
    .option:hover {
      border-color:#4facfe;
      box-shadow:0 8px 15px rgba(79,172,254,.25);
      transform:translateY(-2px);
    }
    .option.selected {
      background-color:#e0f2fe;
      border-color:#0284c7;
      color:#0c4a6e;
      font-weight:600;
    }

    .nav-row {
      display:flex; justify-content:space-between; gap:1rem;
      margin-top:2.3rem;
    }
    .nav-row button.btn-secondary { background:#64748b; }

    #results { display:none; margin-top:2rem; text-align:center; }
    #scoreDisplay { font-size:1.4rem; font-weight:700; margin-top:0.5rem; }
    
    /* Status Message Styling */
    #statusMessage { 
      margin-top:1rem; 
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .status-msg.success { color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; }
    .status-msg.error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; }

    @media (max-width:768px) {
      .card { padding:1.8rem 1.2rem; }
      .nav-row { flex-direction:column; }
    }
  </style>
</head>
<body>

<div class="card" id="startScreen">
  <h2>👤 Participant Details</h2>
  <p style="margin-top:0.5rem;color:#4b5563;">
    Please enter your Name to start the Medical Pharma Quiz.
  </p>

  <label for="studentName">Full Name</label>
  <input id="studentName" type="text" placeholder="Enter your name" />

  <button id="startBtn" style="margin-top:1.2rem;">🚀 Start Quiz</button>
  <div id="startError"></div>
</div>

<div class="card" id="quizCard" style="display:none;">
  <div class="header">
    <h1>Medical Pharma Quiz</h1>
    <p id="metaInfo">20 Questions · Time Tracked</p>
    <p id="timer">Time: 00:00</p>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div id="questionContainer" class="question-block"></div>

  <div class="nav-row">
    <button class="btn-secondary" id="prevBtn" disabled>← Previous</button>
    <button id="nextBtn">Next →</button>
  </div>

  <div id="results">
    <h2>Quiz Completed</h2>
    <div id="scoreDisplay"></div>
    <div id="statusMessage"></div>
    <button id="restartBtn" style="margin-top:1.5rem;">🔄 Restart</button>
  </div>
</div>

<script>
  // ===== EmailJS CONFIGURATION (AUDITED) =====
  const PUBLIC_KEY = 'jpLkp6a1AzI_yB508';
  const SERVICE_ID = 'service_kxs2x4e';     // Confirmed Service ID
  const TEMPLATE_ID = 'template_o5edseb';   // Confirmed Template ID
  const RECEIVER_EMAIL = 'malani86@gmail.com';

  // Safely Initialize EmailJS
  (function() {
    try {
      if (typeof emailjs !== 'undefined') {
        emailjs.init({ publicKey: PUBLIC_KEY });
        console.log("EmailJS initialized successfully.");
      } else {
        console.error("EmailJS SDK failed to load.");
      }
    } catch (error) {
      console.error("EmailJS Initialization Error:", error);
    }
  })();

  // ===== DATA: 20 Questions (Audited against CSV) =====
  const questions = [
    {
      q:'1. What is the Best area (Size )of application of Divigel and which part of the Body.',
      options:[
        'A. 200 cm2 on the arms',
        'B. 200 cm2 on the inner thigh',
        'C. 400 cm2 on the thigh',
        'D. 200 cm2 on the arms'
      ],
      answer:1 // CSV Answer: B
    },
    {
      q:'2. Why do we need a only small area of application of Divigel',
      options:[
        'A. Lower oestradiol absorption occurs due to a high concentration gradient and skin layers acting as reservoirs.',
        'B. Higher oestradiol absorption occurs due to a high concentration gradient and skin layers acting as reservoirs.',
        'C. Higher oestradiol absorption occurs due to a higher concentration gradient and skin layers acting as flow.',
        'D. Higher oestradiol absorption occurs due to a steep concentration gradient and skin layers acting as channels.'
      ],
      answer:1 // CSV Answer: B
    },
    {
      q:'3. Patients On Mirena need to take oral progesteron',
      options:['True', 'False'],
      answer:1 // CSV Answer: False
    },
    {
      q:'4. Divigel should be applied how many times a day',
      options:[
        'A. Once a day',
        'B. Twice a Day',
        'C. Thrice a Day',
        'D. None of the above'
      ],
      answer:0 // CSV Answer: A
    },
    {
      q:'5. Hedrick et al., (2009) is a phase III, randomized, double-blind, parallel group, placebo-controlled, multicenter trial that was designed to compare the efficacy of ________________________________________________ with placebo for the treatment of MSVMS in postmenopausal women.',
      options:[
        'A. 0.5, 1.0 and 1.5 mg of E2 gel 0.1%',
        'B. 0.25, 0.5, and 1.0 mg of E2 gel 0.1%',
        'C. 0.5, 1.0 and 1.5 g of E2 gel 0.1%',
        'D. 0.25, 0.6, and 1.0 g of E2 gel 0.1%'
      ],
      answer:1 // CSV Answer: B
    },
    {
      q:'6. State the maximum of doses levodopa , entacapone and carbidopa can be consumed',
      options:[
        'A. Levodopa (1500mg),Carbidopa (200mg) and Entacapone (2050mg)',
        'B. Levodopa (1200mg ),Carbidopa (150mg) and Entacapone (1800mg)',
        'C. Levodopa (1500mg ),Carbidopa (375mg) and Entacapone (2000mg)',
        'D. Levodopa (2000mg ),Carbidopa (250 mg) and Entacapone (2050mg)'
      ],
      answer:2 // CSV Answer: C
    },
    {
      q:'7. Stalevo Dosage availability in Malaysia',
      options:[
        'A. Stalevo 50mg',
        'B. Stalevo 100mg',
        'C. Stalevo 175mg',
        'D. A & B'
      ],
      answer:3 // CSV Answer: D (A&B)
    },
    {
      q:'8. Switching to Stalevo was associated with improved patient’s CGI-C score with __________ of patients reported an ‘improvement’.',
      options:['A. 24%', 'B. 28%', 'C. 77%', 'D. 86%'],
      answer:2 // CSV Answer: C
    },
    {
      q:'9. In Eggert et al. (2010), patients who switched to LCE observed significant improvements in: i. UPDRS-ADL, Part II; ii. UPDRS motor, Part III; iii. tremor, rigidity and akinesia; iv. QoL-VAS scores',
      options:[
        'A. i, ii',
        'B. i, ii, iv',
        'C. iii, iv',
        'D. i, ii, iii, iv'
      ],
      answer:3 // CSV Answer: D
    },
    {
      q:'10. Nomecomt Study what was the mean "ON" time and the mean "OFF" time in the entacapone Group.',
      options:[
        'A. ON TIME (1.5 HOURS) ; OFF TIME (1.3 hours)',
        'B. ON TIME (1.3 HOURS) ; OFF TIME (1.5 hours)',
        'C. ONTIME (1.3 HOURS); OFF TIME (1.3 HOURS)',
        'D. ON TIME (1.2 HOURS) ; OFF TIME (1.3 HOURS)'
      ],
      answer:1 // CSV Answer: B
    },
    {
      q:'11. Among the PDSS items for all 39 patients who took bedtime Stalevo and completed the study, significant improvements are observed in __________ out of the 15 PDSS items.',
      options:['A. 4', 'B. 5', 'C. 6', 'D. 7'],
      answer:2 // CSV Answer: C
    },
    {
      q:'12. In KUOPPAMAKI et al the dosage of LCE vs CR-LC was',
      options:[
        'A. LCE 200mg; CR-LC 200mg',
        'B. LCE 150mg; CR-LC 200mg',
        'C. LCE 200mg; CR-LC 100mg',
        'D. LCE 150mg; CR-LC 150mg'
      ],
      answer:0 // CSV Answer: A
    },
    {
      q:'13. In Patients expericing WO and Sleep disturbance, those taking bedtime Stalevo showed imporvements in motor and sleep symptoms at',
      options:['A. 1 month', 'B. 2 months', 'C. 6 weeks', 'D. 3 months'],
      answer:3 // CSV Answer: D
    },
    {
      q:'14. In the Lim Thien Thien write up what was the final Stalevo dosage',
      options:[
        'A. Stalevo 100mg (2X)',
        'B. Stalevo 100mg (3X)',
        'C. Stalevo 100mg (4x)',
        'D. Stalevo 150mg (2x)'
      ],
      answer:2 // CSV Answer: C
    },
    {
      q:'15. Cuplaton Dosage for Patients with Post C-Section',
      options:[
        'A. Two tablets a day',
        'B. Three tablets a day',
        'C. Four Tablets a day',
        'D. Contraindicated'
      ],
      answer:2 // CSV Answer: C
    },
    {
      q:'16. What are the core objective of the Direkwatanachai study? Is it To determine whether salbutamol delivered via pMDI + Volumatic® spacer or Easyhaler® (DPI) is as effective as nebulization in treating mild to moderate asthma exacerbations in pediatric patients.',
      options:['True', 'False'],
      answer:0 // CSV Answer: True
    },
    {
      q:'17. In Palandar et al what was the study about and the goal achieved with Easy haler',
      options:[
        'A. Dose Delivery & Consistency',
        'B. Dose Delivery & Resistance',
        'C. Dose Delivery & Inspiratory flow',
        'D. Dose Delivery and Flow Conditions'
      ],
      answer:0 // CSV Answer: A
    },
    {
      q:'18. What is the Dosage of Budesionide that the symtomatic children started and followed through with in Vanto et al over 24 weeks',
      options:[
        'A. (800mg - 400mg)',
        'B. (600mg - 400mg)',
        'C. (800mg - 200mg)',
        'D. (800mg - 600mg)'
      ],
      answer:2 // CSV Answer: C
    },
    {
      q:'19. Direkwatanachai et al., (2011) is a multicenter, randomized, controlled study that was conducted in children between 5 and 18 years of age who presented at an emergency or outpatient department. They were randomized to receive either i. 6 puffs of salbutamol via the pMDI with Volumatic®spacer, ii. 6 puffs of salbutamol via the Easyhaler iii. 0.15 mg/kg of salbutamol nebulized via oxygen (or compressed air) iv. placebo',
      options:[
        'A. i, ii',
        'B. i, ii, iii',
        'C. i, ii, iv',
        'D. ii, iv'
      ],
      answer:1 // CSV Answer: B
    },
    {
      q:'20. Simdax as an inodilator how many hours before a that binds to which part of the mucle cell',
      options:[
        'A. troponin',
        'B. myosin',
        'C. tropomyosin',
        'D. tropomodulin'
      ],
      answer:2 // CSV Answer: C
    }
  ];

  // ===== LOGIC & STATE =====
  let currentQuestion = 0;
  let answers = {}; 
  let candidateName = '';
  let seconds = 0;
  let evaluated = false;
  let timerInterval;

  const startScreen = document.getElementById('startScreen');
  const quizCard = document.getElementById('quizCard');
  const startBtn = document.getElementById('startBtn');
  const startError = document.getElementById('startError');
  const questionContainer = document.getElementById('questionContainer');
  const progressFill = document.getElementById('progressFill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resultsDiv = document.getElementById('results');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const restartBtn = document.getElementById('restartBtn');
  const statusMessage = document.getElementById('statusMessage');
  const timerEl = document.getElementById('timer');

  // TIMER
  function startTimer() {
    timerInterval = setInterval(() => {
      if (!evaluated) {
        seconds++;
        const m = String(Math.floor(seconds/60)).padStart(2,'0');
        const s = String(seconds%60).padStart(2,'0');
        timerEl.textContent = `Time: ${m}:${s}`;
      }
    }, 1000);
  }

  // START
  startBtn.addEventListener('click', () => {
    const name = document.getElementById('studentName').value.trim();
    if (!name) {
      startError.textContent = 'Please enter your Name.';
      return;
    }
    candidateName = name;
    startError.textContent = '';
    startScreen.style.display = 'none';
    quizCard.style.display = 'block';
    startTimer();
    renderQuestion();
  });

  // RENDER QUESTION
  function renderQuestion() {
    const q = questions[currentQuestion];
    progressFill.style.width = ((currentQuestion)/questions.length)*100 + '%';

    let html = `
      <div class="q-header">
        <div class="q-number">${currentQuestion+1}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="options">
    `;
    q.options.forEach((opt, idx) => {
      const isSelected = (answers[currentQuestion] === idx) ? 'selected' : '';
      html += `<div class="option ${isSelected}" data-index="${idx}">${opt}</div>`;
    });
    html += '</div>';

    questionContainer.innerHTML = html;

    // Attach Click Events
    const opts = document.querySelectorAll('.option');
    opts.forEach(opt => {
      opt.addEventListener('click', () => {
        const idx = parseInt(opt.dataset.index);
        answers[currentQuestion] = idx;
        opts.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });

    prevBtn.disabled = currentQuestion === 0;
    nextBtn.textContent = (currentQuestion === questions.length - 1) ? 'Lock & Submit' : 'Next →';
  }

  // NAVIGATION
  prevBtn.addEventListener('click', () => {
    if (currentQuestion > 0) {
      currentQuestion--;
      renderQuestion();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  });

  // FINISH & EVALUATE
  function finishQuiz() {
    evaluated = true;
    clearInterval(timerInterval);
    
    const totalQ = questions.length;
    let correct = 0;
    
    questions.forEach((q, i) => {
      if (answers[i] === q.answer) correct++;
    });

    // UI Updates
    scoreDisplay.textContent = `Your score: ${correct} / ${totalQ}`;
    questionContainer.style.display = 'none';
    document.querySelector('.nav-row').style.display = 'none';
    resultsDiv.style.display = 'block';

    generateAndEmailResults(correct, totalQ);
  }

  // EMAILJS SUBMISSION
  async function generateAndEmailResults(correct, totalQ) {
    statusMessage.textContent = '⏳ Sending results... please wait.';
    statusMessage.className = '';

    try {
      const percent = Math.round((correct/totalQ)*100);
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      const timeStr = `${m}:${s}`;

      // Create HTML Table for Answers
      let tableHtml = '<table border="1" cellpadding="5" cellspacing="0" style="width:100%; border-collapse:collapse; font-size:12px; font-family:Arial;">';
      tableHtml += '<tr style="background:#f3f4f6;"><th>#</th><th>Question</th><th>Selected Answer</th></tr>';

      questions.forEach((q, i) => {
        const userAnsIdx = answers[i];
        const userAnsText = (userAnsIdx !== undefined) ? q.options[userAnsIdx] : 'Not Answered';
        tableHtml += `<tr>
          <td>${i + 1}</td>
          <td>${q.q}</td>
          <td>${userAnsText}</td>
        </tr>`;
      });
      tableHtml += '</table>';

      // Send to EmailJS
      await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
        to_email: RECEIVER_EMAIL,
        from_name: candidateName,
        score: `${correct}/${totalQ} (${percent}%)`,
        time_used: timeStr,
        answers_table: tableHtml
      });

      statusMessage.textContent = '✅ Results sent successfully! You may close this tab.';
      statusMessage.className = 'status-msg success';

    } catch (e) {
      console.error("Submission Failed:", e);
      let errorInfo = (e.text) ? e.text : 'Network or Config Error';
      statusMessage.textContent = `❌ Failed to send results: ${errorInfo}`;
      statusMessage.className = 'status-msg error';
    }
  }

  restartBtn.addEventListener('click', () => { location.reload(); });
</script>
</body>
</html>
